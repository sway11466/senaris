<meta charset="utf-8">
<title>Senaris logo preview</title>
<style>
  body { margin: 0; font: 13px/1.6 system-ui, sans-serif; }
  .band { padding: 28px 32px; }
  .dark { background: #14161a; color: #9aa1aa; }
  .light { background: #ffffff; color: #6b7078; }
  .mid { background: #6b7078; color: #f0f0f0; }
  h2 { font-size: 13px; font-weight: 500; margin: 0 0 18px; letter-spacing: .04em; }
  .row { display: flex; align-items: flex-end; gap: 40px; flex-wrap: wrap; }
  figure { margin: 0; }
  figcaption { margin-top: 8px; font-size: 11px; opacity: .75; }
  img { display: block; }
</style>

<div class="band dark">
  <h2>暗背景版 — logo_dark.svg</h2>
  <div class="row">
    <figure><img src="logo_dark.svg" width="460"><figcaption>460px（ヘッダーカプセル幅）</figcaption></figure>
    <figure><img src="logo_dark.svg" width="231"><figcaption>231px（小カプセル幅）</figcaption></figure>
    <figure><img src="logo_dark.svg" width="120"><figcaption>120px</figcaption></figure>
  </div>
</div>

<div class="band dark">
  <h2>小サイズ用（タイルの隙間を広げた版） — logo_small_dark.svg</h2>
  <div class="row">
    <figure><img src="logo_small_dark.svg" width="231"><figcaption>231px</figcaption></figure>
    <figure><img src="logo_small_dark.svg" width="120"><figcaption>120px</figcaption></figure>
    <figure><img src="logo_dark.svg" width="120"><figcaption>比較：通常版 120px</figcaption></figure>
  </div>
</div>

<div class="band light">
  <h2>明背景版 — logo_light.svg</h2>
  <div class="row">
    <figure><img src="logo_light.svg" width="460"><figcaption>460px</figcaption></figure>
    <figure><img src="logo_light.svg" width="231"><figcaption>231px</figcaption></figure>
    <figure><img src="logo_light.svg" width="120"><figcaption>120px</figcaption></figure>
  </div>
</div>

<div class="band mid">
  <h2>単色版 — logo_mono-white.svg / logo_mono-black.svg</h2>
  <div class="row">
    <figure><img src="logo_mono-white.svg" width="300"><figcaption>白1色</figcaption></figure>
    <figure><img src="logo_mono-black.svg" width="300"><figcaption>黒1色</figcaption></figure>
    <figure><img src="logo_mono-white.svg" width="120"><figcaption>白1色 120px</figcaption></figure>
  </div>
</div>
